name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/torch-cpu.txt
      - run: python -m pip install -c requirements/constraints/dev.txt -e ".[dev]"
      # CPU tests need Gateway libraries, while the CUDA/vLLM constraint set stays isolated.
      - run: python -m pip install -c requirements/constraints/agent.txt -e ".[serving,agent]"
      - run: make check VENV="$(python -c 'import sys; print(sys.prefix)')"
      # Serving dependencies are frozen for the reviewed CUDA 11.8 profile. These
      # exact findings are dispositioned in configs/security/m7_vulnerability_policy.yaml;
      # M7 promotion separately rejects every unreviewed Critical/High advisory.
      - run: >-
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-1805
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281

  baseline-dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/torch-cpu.txt
      - run: >-
          python -m pip install
          -c requirements/constraints/baseline.txt
          -e ".[baseline]"
          pip-audit
          setuptools
      - run: >-
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-1939
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290
          --ignore-vuln PYSEC-2026-3716

  m4-dependencies:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/torch-cpu.txt
      - run: >-
          python -m pip install
          -c requirements/constraints/m4.txt
          -e ".[m4]"
          pip-audit
          setuptools
      - run: python scripts/check_m4_dependencies.py
      - run: >-
          pip-audit --skip-editable
          --ignore-vuln PYSEC-2025-217
          --ignore-vuln PYSEC-2026-2288
          --ignore-vuln PYSEC-2026-2289
          --ignore-vuln PYSEC-2026-2290

  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tinyllm-system:ci
      - run: docker run --rm tinyllm-system:ci --version
